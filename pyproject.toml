[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "the-mailroom"
version = "0.5.1"
description = "Trace-backend-neutral visual console for the llm-mailroom pipeline — Phoenix, Langfuse and conformant adapters."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "langfuse>=4.0,<5",
    "pydantic>=2.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Canonical offline scoring; default display dependencies remain light.
# Dojo v0.27.2, matched to the adopted producer and pinned by immutable commit.
eval = ["llm-dojo-scoring @ git+https://github.com/Exios66/llm-dojo-scoring.git@1cd4aba76d82eea20c6e8dfcc0d760881bf84924"]
# Full development tests exercise offline evaluation with the canonical engine.
dev = ["the-mailroom[eval]", "pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "bcrypt", "PyJWT", "watchdog"]
# Pinned llm-mailroom (PyPI / dist name: mailroom) @ reviewed source 9e8f30b279e7626c056b03511f823105760f80d7
# (package 0.9.1; mailroom-dataset tag v9.1, llm-dojo-scoring v0.27.2
#  at 1cd4aba76d82eea20c6e8dfcc0d760881bf84924). Pulls
# langgraph, Phoenix, and llm-dojo-scoring — the visualizer display path never imports
# those. Contract helpers live in mailroom_ui/producer.py
# (pipeline.review_resolve, schemas.manifest). Install with:
#   pip install -e ".[pipeline]"
pipeline = [
    "mailroom @ git+https://github.com/Exios66/llm-mailroom.git@9e8f30b279e7626c056b03511f823105760f80d7",
    "structlog>=24.0",
    "pyyaml>=6.0",
]
# Operator desk (auth / archive / bin observer). Display stays trace-backed.
# bcrypt + PyJWT preferred; stdlib pbkdf2/HMAC fallbacks exist without them.
operator = [
    "bcrypt",
    "PyJWT",
    "watchdog",
    "pymupdf",
]
# Optional React operator desk (`ui/`). Marker only — Node 22+ is required
# separately (`cd ui && npm install && npm run build`). Default [dev] never
# installs npm. Built assets mount at /desk when ui/dist exists.
ui = []

[project.scripts]
mailroom-web = "server.main:run"
mailroom-hosted = "server.hosted:run"
mailroom-tui = "tui.mailroom_console:run"
mailroom-observer = "operator_desk.observer:run"

[tool.setuptools.packages.find]
include = ["mailroom_ui*", "server*", "tui*", "operator_desk*"]

[tool.setuptools.package-data]
mailroom_ui = ["contract/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Monorepo dev: resolve the pipeline from the workspace instead of the
# release git pin above. Plain `pip install .` keeps using the pin.
[tool.uv.sources]
mailroom = { workspace = true }
llm-dojo-scoring = { workspace = true }
